name: AOB write safety tests
on:
  pull_request:
    paths:
      - 'lib/aob-write-planner.js'
      - 'test/aob-write-planner.test.js'
      - '.github/workflows/aob-write-safety.yml'
  push:
    branches: [main]
    paths:
      - 'lib/aob-write-planner.js'
      - 'test/aob-write-planner.test.js'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/aob-write-planner.test.js
