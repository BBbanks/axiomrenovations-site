<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Axiom Operating Board</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Axiom Renovations</p>
        <h1>Operating Board</h1>
        <p id="buildVersion" class="build-version" aria-label="App build version">Build checking…</p>
      </div>
      <button id="refreshBtn" class="button secondary" type="button">Refresh</button>
    </header>

    <section class="summary" aria-label="Business summary">
      <article><strong id="attentionCount">0</strong><span>Needs attention</span></article>
      <article><strong id="leadCount">0</strong><span>Leads</span></article>
      <article><strong id="estimateCount">0</strong><span>Estimates</span></article>
      <article><strong id="jobCount">0</strong><span>Jobs</span></article>
    </section>

    <section class="controls" aria-label="Board filters">
      <div class="filter-block">
        <span class="filter-label">View</span>
        <div class="filters" id="filters">
          <button type="button" class="chip active" data-filter="attention">Attention</button>
          <button type="button" class="chip" data-filter="all">All</button>
          <button type="button" class="chip" data-filter="lead">Leads</button>
          <button type="button" class="chip" data-filter="estimate">Estimates</button>
          <button type="button" class="chip" data-filter="job">Jobs</button>
        </div>
      </div>

      <div class="filter-block owner-block">
        <span class="filter-label">Owner</span>
        <div class="owner-filters" id="ownerFilters" role="group" aria-label="Filter by owner">
          <button type="button" class="owner-chip active" data-owner="all" aria-pressed="true">Everyone</button>
          <button type="button" class="owner-chip" data-owner="Brandon" aria-pressed="false">Brandon</button>
          <button type="button" class="owner-chip" data-owner="Nicole" aria-pressed="false">Nicole</button>
        </div>
      </div>
    </section>

    <p id="statusMessage" class="status" role="status"></p>
    <section id="cards" class="cards" aria-live="polite"></section>

    <dialog id="detailDialog">
      <form method="dialog" class="detail">
        <div class="detail-head">
          <div>
            <p id="detailType" class="eyebrow"></p>
            <h2 id="detailName"></h2>
          </div>
          <button class="button secondary" value="close">Close</button>
        </div>
        <dl class="detail-grid">
          <div><dt>Stage</dt><dd id="detailStage"></dd></div>
          <div><dt>Owner</dt><dd id="detailOwner"></dd></div>
          <div><dt>Current state</dt><dd id="detailState"></dd></div>
          <div><dt>Next action</dt><dd id="detailNext"></dd></div>
          <div><dt>Waiting on</dt><dd id="detailWaiting"></dd></div>
          <div><dt>Strategic context</dt><dd id="detailStrategy"></dd></div>
        </dl>
        <div class="detail-actions">
          <a id="folderLink" class="button primary" href="#" target="_blank" rel="noopener noreferrer">Open job record</a>
        </div>
      </form>
    </dialog>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
