<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Axiom Board Login</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><section class="login-panel"><p class="eyebrow">Axiom Renovations</p><h1>Operating Board</h1><p class="status">Authorized Axiom users only.</p><form id="loginForm"><label class="login-label">Dashboard password<input id="password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">Sign in</button><p id="loginStatus" class="status" role="status"></p></form></section></main><script>const f=document.getElementById("loginForm"),s=document.getElementById("loginStatus");f.addEventListener("submit",async e=>{e.preventDefault();s.textContent="Signing in…";const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});if(r.ok){location.href="./"}else{s.textContent="Unable to sign in."}});</script></body></html>
